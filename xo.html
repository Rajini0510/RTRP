<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe vs Robot</title>
  <style>
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      background-color: #f0f0f0;
    }
    h1 {
      margin-top: 20px;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      gap: 5px;
      margin: 20px;
    }
    .cell {
      width: 100px;
      height: 100px;
      background-color: white;
      font-size: 2em;
      text-align: center;
      line-height: 100px;
      border: 2px solid #333;
      cursor: pointer;
    }
    .cell.taken {
      cursor: not-allowed;
    }
    #message {
      font-size: 1.2em;
      margin-top: 10px;
    }
    button {
      padding: 10px 20px;
      font-size: 1em;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <h1>Tic Tac Toe vs Robot</h1>
  <div id="board"></div>
  <div id="message"></div>
  <button onclick="resetGame()">Restart</button>

  <script>
    const boardElement = document.getElementById('board');
    const messageElement = document.getElementById('message');
    let board = ["", "", "", "", "", "", "", "", ""];
    let gameOver = false;

    function drawBoard() {
      boardElement.innerHTML = '';
      board.forEach((cell, i) => {
        const div = document.createElement('div');
        div.className = 'cell' + (cell ? ' taken' : '');
        div.textContent = cell;
        div.addEventListener('click', () => handlePlayerMove(i));
        boardElement.appendChild(div);
      });
    }

    function handlePlayerMove(index) {
      if (board[index] || gameOver) return;
      board[index] = "X";
      drawBoard();
      if (checkWin("X")) {
        messageElement.textContent = "You win!";
        gameOver = true;
        return;
      }
      if (board.every(cell => cell)) {
        messageElement.textContent = "It's a draw!";
        gameOver = true;
        return;
      }
      setTimeout(robotMove, 500); // Delay for realism
    }

    function robotMove() {
      const emptyIndices = board.map((val, idx) => val === "" ? idx : null).filter(v => v !== null);
      if (emptyIndices.length === 0 || gameOver) return;
      const move = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
      board[move] = "O";
      drawBoard();
      if (checkWin("O")) {
        messageElement.textContent = "Robot wins!";
        gameOver = true;
        return;
      }
      if (board.every(cell => cell)) {
        messageElement.textContent = "It's a draw!";
        gameOver = true;
      }
    }

    function checkWin(player) {
      const winCombos = [
        [0,1,2],[3,4,5],[6,7,8],
        [0,3,6],[1,4,7],[2,5,8],
        [0,4,8],[2,4,6]
      ];
      return winCombos.some(combo => 
        combo.every(i => board[i] === player)
      );
    }

    function resetGame() {
      board = ["", "", "", "", "", "", "", "", ""];
      gameOver = false;
      messageElement.textContent = "";
      drawBoard();
    }

    drawBoard();
  </script>
</body>
</html>
